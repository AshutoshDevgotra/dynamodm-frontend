  <text x="540" y="1198" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="900">START YOUR FREE MONTH  →</text>
  <text x="540" y="1285" text-anchor="middle" fill="#a99891" font-family="Arial, sans-serif" font-size="16">No long-term commitment. Cancel before renewal.</text>
