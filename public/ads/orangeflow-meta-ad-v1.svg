  <text x="540" y="808" text-anchor="middle" fill="#fffaf6" font-family="Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="-4">₹99</text>
  <text x="540" y="842" text-anchor="middle" fill="#e5d8d2" font-family="Arial, sans-serif" font-size="25" font-weight="600">per month after your free month</text>

  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fffaf6">
    <rect x="120" y="940" width="250" height="76" rx="38" fill="#f36f4c"/><text x="245" y="988" text-anchor="middle">AutoDM</text>
    <rect x="415" y="940" width="250" height="76" rx="38" fill="#f36f4c"/><text x="540" y="988" text-anchor="middle">Lead capture</text>
