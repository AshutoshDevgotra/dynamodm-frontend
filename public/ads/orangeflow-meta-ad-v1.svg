  <rect width="1080" height="1350" fill="url(#glow)"/>
  <circle cx="70" cy="180" r="250" fill="#f36f4c" opacity=".12" filter="url(#shadow)"/>
  <circle cx="1010" cy="1200" r="260" fill="#ffad91" opacity=".13" filter="url(#shadow)"/>

  <text x="540" y="105" text-anchor="middle" fill="#fffaf6" font-family="Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-2">OrangeFlow<tspan fill="#f36f4c">.</tspan></text>
  <text x="540" y="152" text-anchor="middle" fill="#ffad91" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">THE CREATOR GROWTH TOOLKIT</text>

