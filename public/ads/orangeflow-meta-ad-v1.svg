    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ffad91"/><stop offset=".45" stop-color="#f36f4c"/><stop offset="1" stop-color="#d9573a"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#ffd2c3"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
